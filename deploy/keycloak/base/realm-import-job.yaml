# Realm as code (thiết kế mục 10): keycloak-config-cli áp dụng realm sau mỗi lần Argo CD sync, cập nhật cả realm đã có
# (KeycloakRealmImport của operator chỉ tạo mới, không cập nhật). Biến $(env:...) trong realm lấy từ Secret
# keycloak-realm-secrets. Đăng nhập bằng tài khoản bootstrap admin của master realm.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-import
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm-import
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak-config-cli
          # Bản build cho Keycloak 26.x gần nhất có sẵn; dùng Admin REST API ổn định trong 26.x
          image: adorsys/keycloak-config-cli:6.5.1-26.5.5
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak-service:8080
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-admin
                  key: username
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-admin
                  key: password
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 300s
            - name: IMPORT_FILES_LOCATIONS
              value: /config/ecommerce-realm.json
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            # Không xóa user/role tạo tay trên Keycloak (khách hàng, nhân viên), chỉ đồng bộ phần khai báo
            - name: IMPORT_MANAGED_USER
              value: no-delete
            - name: IMPORT_MANAGED_GROUP
              value: no-delete
          envFrom:
            - secretRef:
                name: keycloak-realm-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: tmp
          emptyDir: {}
