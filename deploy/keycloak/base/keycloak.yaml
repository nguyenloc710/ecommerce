# CR Keycloak: operator tạo StatefulSet và Service "keycloak-service" (tên service dùng trong
# deploy/environments/*: KEYCLOAK_JWK_SET_URI, KEYCLOAK_TOKEN_URI).
# - hostname là URL public: token luôn có iss = https://auth.<domain>/realms/ecommerce (service kiểm tra iss này)
# - backchannelDynamic: service trong cluster gọi http://keycloak-service:8080 lấy JWKS/token
# - TLS kết thúc ở Traefik (Ingress trong overlay), pod chạy HTTP và tin header X-Forwarded-*
# Image tùy biến (frontend/keycloak-theme/Dockerfile): Keycloak 26.7.5 + theme đăng nhập "ecommerce" (E6.4), đã chạy
# kc.sh build (db postgres, health, metrics) nên operator khởi động ở chế độ optimized. CI cập nhật tag.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
spec:
  instances: 1
  image: ghcr.io/your-org/ecommerce/keycloak:0000000
  startOptimized: true
  bootstrapAdmin:
    user:
      secret: keycloak-bootstrap-admin
  db:
    vendor: postgres
    host: pg-rw
    port: 5432
    database: keycloak_db
    usernameSecret:
      name: pg-keycloak-credentials
      key: username
    passwordSecret:
      name: pg-keycloak-credentials
      key: password
  http:
    httpEnabled: true
    httpPort: 8080
  hostname:
    hostname: https://auth.example.vn
    backchannelDynamic: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  additionalOptions:
    - name: metrics-enabled
      value: "true"
    - name: health-enabled
      value: "true"
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 768Mi
