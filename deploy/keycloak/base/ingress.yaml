# Chỉ mở đường dẫn công khai của Keycloak (trang đăng nhập, OIDC, tài nguyên tĩnh). Admin console (/admin) không
# route ra ngoài (thiết kế mục 11); quản trị qua kubectl port-forward. Host do overlay đặt.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [auth.example.vn]
      secretName: keycloak-tls
  rules:
    - host: auth.example.vn
      http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
