# Môi trường staging: SealedSecret → dữ liệu → Keycloak → service + ingress (sync-wave).
# Staging: tự đồng bộ và dọn tài nguyên thừa.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/nguyenloc710/ecommerce.git
    targetRevision: main
    path: deploy/secrets/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
