---
# Mỗi service Spring Boot một Application: chart chung deploy/charts/spring-service + values môi trường
# (CI cập nhật image.tag trong deploy/environments/prod/<service>.yaml).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - service: gateway
          - service: customer-service
          - service: catalog-service
          - service: order-service
          - service: notification-service
  template:
    metadata:
      name: "{{.service}}-prod"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/nguyenloc710/ecommerce.git
          targetRevision: main
          path: deploy/charts/spring-service
          helm:
            releaseName: "{{.service}}"
            valueFiles:
              - $values/deploy/environments/prod/{{.service}}.yaml
        - repoURL: https://github.com/nguyenloc710/ecommerce.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: prod
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
