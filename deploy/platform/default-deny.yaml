# Chặn mọi traffic vào pod trong namespace môi trường; từng thành phần tự mở đúng nguồn được phép
# (chart spring-service, deploy/data, deploy/keycloak). Egress để mở (pod cần gọi DNS, Keycloak, đối tác).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: staging
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
