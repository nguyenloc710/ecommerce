# catalog-service — môi trường staging. Tag ảnh do CI cập nhật.
image:
  repository: ghcr.io/your-org/ecommerce/catalog-service
  tag: "0000000"

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    memory: 768Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4

pdb:
  enabled: false

env:
  APP_ENV: staging
  KEYCLOAK_ISSUER_URI: https://auth-staging.example.vn/realms/ecommerce
  KEYCLOAK_JWK_SET_URI: http://keycloak-service:8080/realms/ecommerce/protocol/openid-connect/certs
  TRACING_EXPORT_ENABLED: "true"
  OTLP_TRACING_ENDPOINT: http://alloy.platform:4318/v1/traces
  DB_URL: jdbc:postgresql://pg-rw:5432/catalog_db
  RABBITMQ_HOST: rabbitmq
  # Kho ảnh đánh giá (E7.1, B-29): Cloudflare R2. Khóa R2 (MEDIA_ACCESS_KEY/MEDIA_SECRET_KEY) nằm trong catalog-service-secrets.
  # Bucket, CORS (cho phép PUT từ storefront) và domain công khai tạo bằng tay trên Cloudflare. TODO(go-live): thay ACCOUNT_ID, domain.
  MEDIA_ENDPOINT: https://ACCOUNT_ID.r2.cloudflarestorage.com
  MEDIA_BUCKET: ecommerce-media-staging
  MEDIA_PUBLIC_BASE_URL: https://media-staging.example.vn
  MEDIA_PATH_STYLE: "false"
  MEDIA_CREATE_BUCKET: "false"

# SealedSecret cung cấp DB_USERNAME/DB_PASSWORD, RABBITMQ_*, KEYCLOAK_CLIENT_SECRET...
envFromSecrets:
  - catalog-service-secrets

networkPolicy:
  ingressFrom:
    - gateway
    - order-service
  ingressFromNamespaces: []
