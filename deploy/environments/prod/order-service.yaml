# order-service — môi trường prod. Tag ảnh do CI cập nhật.
image:
  repository: ghcr.io/your-org/ecommerce/order-service
  tag: "0000000"

replicas: 2

resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

pdb:
  enabled: true

env:
  APP_ENV: prod
  KEYCLOAK_ISSUER_URI: https://auth.example.vn/realms/ecommerce
  KEYCLOAK_JWK_SET_URI: http://keycloak-service:8080/realms/ecommerce/protocol/openid-connect/certs
  TRACING_EXPORT_ENABLED: "true"
  OTLP_TRACING_ENDPOINT: http://alloy.platform:4318/v1/traces
  DB_URL: jdbc:postgresql://pg-rw:5432/order_db
  RABBITMQ_HOST: rabbitmq
  CATALOG_BASE_URL: http://catalog-service:8080
  KEYCLOAK_TOKEN_URI: http://keycloak-service:8080/realms/ecommerce/protocol/openid-connect/token
  # Cổng thanh toán giả chỉ dùng ở dev/staging
  PAYMENT_MOCK_ENABLED: "false"
  # VNPay/MoMo bật khi có credential (B-24, B-25); secret nằm trong order-service-secrets
  VNPAY_ENABLED: "false"
  VNPAY_RETURN_URL: https://shop.example.vn/thanh-toan/ket-qua/{orderCode}
  MOMO_ENABLED: "false"
  MOMO_REDIRECT_URL: https://shop.example.vn/thanh-toan/ket-qua/{orderCode}
  MOMO_IPN_URL: https://api.example.vn/webhooks/payments/momo

# SealedSecret cung cấp DB_USERNAME/DB_PASSWORD, RABBITMQ_*, KEYCLOAK_CLIENT_SECRET...
envFromSecrets:
  - order-service-secrets

networkPolicy:
  ingressFrom:
    - gateway
  ingressFromNamespaces: []
