name: storefront-ci

on:
  pull_request:
    paths:
      - "frontend/storefront/**"
      - ".github/workflows/storefront-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/storefront/**"
      - ".github/workflows/storefront-ci.yml"

permissions:
  contents: read

concurrency:
  group: storefront-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/storefront/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Không có backend trong CI: trang dùng dữ liệu dự phòng, cache tự làm mới khi chạy thật
      - run: npm run build

