name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Build + unit test + Spring Modulith verify (ranh giới module).
      # chmod vì repo được tạo trên Windows nên mvnw có thể chưa có quyền thực thi.
      - name: Build và test
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Lưu tài liệu module (Spring Modulith)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: backend/*/target/spring-modulith-docs
          if-no-files-found: ignore

  # Bật khi đã có registry: build image bằng Jib (không cần Docker daemon), tag = git SHA.
