server:
  port: ${SERVER_PORT:8093}
  shutdown: graceful

spring:
  application:
    name: order-service
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 10s
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  messages:
    basename: messages,common-messages
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ecommerce}
    password: ${RABBITMQ_PASSWORD:ecommerce}
    listener:
      simple:
        observation-enabled: true
    template:
      observation-enabled: true
  modulith:
    events:
      externalization:
        enabled: true
      republish-outstanding-events-on-restart: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss phải khớp URL public của Keycloak; JWKS lấy qua địa chỉ nội bộ khi chạy trong cluster
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
          audiences: ecommerce-api
      # Token client_credentials để gọi /internal/** của catalog-service
      client:
        registration:
          keycloak-internal:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:order-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:order-service-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/token}

ecommerce:
  security:
    # Webhook cổng thanh toán và hãng vận chuyển: không có JWT, xác thực bằng chữ ký trong controller
    public-paths:
      - /webhooks/**
  clients:
    # Registration client_credentials (role INTERNAL) dùng chung cho mọi client /internal
    internal-registration-id: keycloak-internal
    catalog:
      base-url: ${CATALOG_BASE_URL:http://localhost:8092}
    customer:
      base-url: ${CUSTOMER_BASE_URL:http://localhost:8091}
  cart:
    max-lines: 50
    max-quantity-per-line: 99
  shipping:
    # B-07: freeship từ 500.000₫
    freeship-threshold: 500000
    # B-07: phí mặc định khi chưa tích hợp API hãng thật (MockCarrier)
    carriers:
      - code: GHN
        name: Giao Hàng Nhanh
        fee: 25000
        eta-days: 3
      - code: GHTK
        name: Giao Hàng Tiết Kiệm
        fee: 18000
        eta-days: 4
    mock:
      secret: ${SHIPPING_MOCK_SECRET:shipping-mock-dev-secret}
  payment:
    mock:
      secret: ${PAYMENT_MOCK_SECRET:payment-mock-dev-secret}
      pay-url-template: ${PAYMENT_MOCK_PAY_URL:http://localhost:3000/thanh-toan/mock/{orderId}?ma={orderCode}}
    # E6.1, P-03: tắt mặc định; bật khi có tmnCode/hashSecret (sandbox: sandbox.vnpayment.vn)
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url-template: ${VNPAY_RETURN_URL:http://localhost:3000/thanh-toan/ket-qua/{orderCode}}
      expire-after: 15m
  orders:
    # B-20: đơn online chưa thanh toán quá hạn này sẽ bị hủy (= TTL giữ hàng B-03)
    payment-timeout: 15m
    expiry-check-interval: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
  # Metrics đi qua Prometheus scrape; OTLP metrics push tắt mặc định (bật khi có collector)
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    vn.ecommerce: INFO
  structured:
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:dev}
        environment: ${APP_ENV:local}

---
# Trên Kubernetes: log JSON (ECS) ra stdout để Grafana Alloy thu về Loki
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
logging:
  structured:
    format:
      console: ecs
