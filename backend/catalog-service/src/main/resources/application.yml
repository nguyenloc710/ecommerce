server:
  port: ${SERVER_PORT:8092}
  shutdown: graceful

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  messages:
    basename: messages,common-messages
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USERNAME:catalog}
    password: ${DB_PASSWORD:catalog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      org.hibernate.envers.audit_table_suffix: _aud
      org.hibernate.envers.revision_field_name: rev
      org.hibernate.envers.revision_type_field_name: revtype
  flyway:
    enabled: true
    # Local: nạp thêm dữ liệu mẫu (R__seed_dev.sql); trên Kubernetes ghi đè chỉ còn db/migration
    locations: classpath:db/migration,classpath:db/seed
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ecommerce}
    password: ${RABBITMQ_PASSWORD:ecommerce}
    listener:
      simple:
        observation-enabled: true
        # Lỗi quá 3 lần thì reject không requeue -> DLQ (xem OrderEventsTopology)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
    template:
      observation-enabled: true
  modulith:
    events:
      externalization:
        enabled: true
      republish-outstanding-events-on-restart: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss phải khớp URL public của Keycloak; JWKS lấy qua địa chỉ nội bộ khi chạy trong cluster
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
          audiences: ecommerce-api

ecommerce:
  inventory:
    reservation-ttl: 15m
    optimistic-retries: 3
    default-low-stock: 3
    expiry-batch-size: 200
    expiry-check-interval: 60s
  security:
    public-get-paths:
      - /api/products/**
      - /api/categories/**
      - /api/brands/**
      - /api/reviews/**
      - /api/inventory/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
  # Metrics đi qua Prometheus scrape; OTLP metrics push tắt mặc định (bật khi có collector)
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    vn.ecommerce: INFO
  structured:
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:dev}
        environment: ${APP_ENV:local}

---
# Trên Kubernetes: log JSON (ECS) ra stdout để Grafana Alloy thu về Loki
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
  flyway:
    locations: classpath:db/migration
logging:
  structured:
    format:
      console: ecs
