server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

spring:
  application:
    name: customer-service
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  messages:
    basename: messages,common-messages
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/customer_db}
    username: ${DB_USERNAME:customer}
    password: ${DB_PASSWORD:customer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # db/reference: dữ liệu tham chiếu (tỉnh/phường) nạp ở mọi môi trường
    locations: classpath:db/migration,classpath:db/reference
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ecommerce}
    password: ${RABBITMQ_PASSWORD:ecommerce}
    listener:
      simple:
        observation-enabled: true
    template:
      observation-enabled: true
  modulith:
    events:
      externalization:
        enabled: true
      republish-outstanding-events-on-restart: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss phải khớp URL public của Keycloak; JWKS lấy qua địa chỉ nội bộ khi chạy trong cluster
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
          audiences: ecommerce-api
      # Service account gọi Keycloak Admin API (chỉ có view-users, manage-users)
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:customer-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:customer-service-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/token}

ecommerce:
  security:
    public-get-paths:
      - /api/divisions/**
  address:
    max-per-customer: 10
  clients:
    keycloak-admin:
      # Admin API: <base-url>/admin/realms/<realm>/...
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8180}
      realm: ecommerce
      staff-group: staff
      registration-id: keycloak-admin

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
  # Metrics đi qua Prometheus scrape; OTLP metrics push tắt mặc định (bật khi có collector)
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    vn.ecommerce: INFO
  structured:
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:dev}
        environment: ${APP_ENV:local}

---
# Trên Kubernetes: log JSON (ECS) ra stdout để Grafana Alloy thu về Loki
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
logging:
  structured:
    format:
      console: ecs
