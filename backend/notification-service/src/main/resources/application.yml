server:
  port: ${SERVER_PORT:8094}
  shutdown: graceful

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  messages:
    basename: messages,common-messages
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USERNAME:notification}
    password: ${DB_PASSWORD:notification}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ecommerce}
    password: ${RABBITMQ_PASSWORD:ecommerce}
    listener:
      simple:
        observation-enabled: true
        # Lỗi quá 3 lần (backoff 2s, 4s) thì reject không requeue -> DLQ (xem NotificationTopology)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
    template:
      observation-enabled: true
  # Service này chỉ consume, không phát event ra ngoài
  modulith:
    events:
      externalization:
        enabled: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1026}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  thymeleaf:
    # Chỉ dùng cho email, không phục vụ trang web
    check-template-location: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss phải khớp URL public của Keycloak; JWKS lấy qua địa chỉ nội bộ khi chạy trong cluster
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
          audiences: ecommerce-api

ecommerce:
  notification:
    shop-name: ${SHOP_NAME:Maison}
    from: ${MAIL_FROM:Maison <no-reply@example.vn>}
    storefront-url: ${STOREFRONT_URL:http://localhost:3000}
    default-locale: vi

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
  # Metrics đi qua Prometheus scrape; OTLP metrics push tắt mặc định (bật khi có collector)
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    vn.ecommerce: INFO
  structured:
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:dev}
        environment: ${APP_ENV:local}

---
# Trên Kubernetes: log JSON (ECS) ra stdout để Grafana Alloy thu về Loki
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
logging:
  structured:
    format:
      console: ecs
