<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, body)" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Tiêu đề</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ec;font-family:Georgia,serif;color:#1c1a17;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;">
        <tr>
          <td style="padding:28px 32px 8px;text-align:center;letter-spacing:0.3em;font-size:14px;text-transform:uppercase;"
              th:text="${shopName}">Maison</td>
        </tr>
        <tr>
          <td style="padding:8px 32px 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#2a2622;">
            <th:block th:replace="${body}"/>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 28px;border-top:1px solid #e8e2d9;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#8a8279;text-align:center;">
            Email tự động từ <span th:text="${shopName}">Maison</span>. Cần hỗ trợ, vui lòng trả lời email này.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
