<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: page('Đã nhận đơn hàng', ~{::content})}" lang="vi">
<body>
<th:block th:fragment="content">
  <h1 style="font-family:Georgia,serif;font-weight:normal;font-size:24px;margin:16px 0 8px;">Cảm ơn bạn đã đặt hàng</h1>
  <p>Đơn hàng <strong th:text="${orderCode}">ORD-000000-0000</strong> đã được ghi nhận. Chúng tôi sẽ đóng gói và gửi đi sớm nhất.</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:20px 0;">
    <tr th:each="line : ${lines}" style="border-bottom:1px solid #eee7de;">
      <td style="padding:10px 0;">
        <div th:text="${line.productName}">Sản phẩm</div>
        <div style="color:#8a8279;font-size:13px;" th:text="${line.variantLabel}">Biến thể</div>
      </td>
      <td style="padding:10px 0;text-align:center;white-space:nowrap;" th:text="'× ' + ${line.quantity}">× 1</td>
      <td style="padding:10px 0;text-align:right;white-space:nowrap;"
          th:text="${#numbers.formatDecimal(line.unitPrice * line.quantity, 1, 'POINT', 0, 'COMMA')} + '₫'">0₫</td>
    </tr>
    <tr>
      <td colspan="2" style="padding:14px 0 0;font-weight:bold;">Tổng thanh toán</td>
      <td style="padding:14px 0 0;text-align:right;font-weight:bold;white-space:nowrap;"
          th:text="${#numbers.formatDecimal(total, 1, 'POINT', 0, 'COMMA')} + '₫'">0₫</td>
    </tr>
  </table>
  <p style="margin:24px 0;">
    <a th:href="${storefrontUrl + '/tai-khoan/don-hang/' + orderCode}" style="display:inline-block;padding:12px 28px;background:#1c1a17;color:#ffffff;text-decoration:none;letter-spacing:0.1em;font-size:13px;text-transform:uppercase;">Xem đơn hàng</a>
  </p>
</th:block>
</body>
</html>
